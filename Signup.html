<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Signup</title>
        
    </head>
    <body>
        
        <div class="container style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <h2 justify-content-center>Welcome To the TripSplit</h2>
        <div class="Card shadow p-4 border-0" style="width: 450px; background-color: rgb(228, 232, 236);">

           <div class="Card-body ">
             <h2 class="Card-title text-center mb-4 fw-bold ">SignUp</h2>
        <form >
             <div class="mb-3 ">
            <label class="form-label"> Email </label>
            <input type="email" class="form-control" placeholder="Enter the Email" style="margin-bottom: 20px">
            </div>

            <div class="mb-3" >
            <label class="form-label ">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary">Signup</button>
            
        </form>
        </div>
    </div>  
</div>
    </body>
    </html>
